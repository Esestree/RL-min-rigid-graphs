[project]
name = "project_utils"
version = "0.1.0"
description = "Modules used in project"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
