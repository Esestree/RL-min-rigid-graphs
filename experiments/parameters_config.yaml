# Configuration for the experiments. This configuration defines problem, training hypserparameters,
# neural network architecture, and entropy regularization settings.

# implementation of program to use
impl: max_plane

# name of the experiment in the mlflow
experiment_name: ${impl}
#experiment_name: my_precious_graphs

problem:
  # number of vertices of the minimally rigid graph
  n_vertices: 10

  # initial subgraph in a construction sequence
  base_graph: [[0, 1], [1, 2], [2, 3], [3, 0], [1, 3]]

general:
  # print to stdin results of each generation
  verbosity: 1

  # setting the seed to ensure reproducibility of the results
  seed: ${random:0,9999999}
  # seed: 123

  # save graphs and rewards once in artifact_saving_frequency generations
  artifact_saving_frequency: 1

training:
  # number of iterations of the deep cross-entropy method
  n_gen: 250
  # n_gen: 500 # for NAC colorings

  # number of graphs that are generated in each generation (iteration)
  gen_size: 1000

  # fraction of the graphs (elites) used for training the neural network
  train_best: 0.064

  # fraction of the elites that are taken to the next generation. 
  survival_rate: ${eval:${training.train_best} * 0.25}
  # survival_rate: 0.016


  # the fraction of graphs for which the main (expensive) reward function is computed,
  # after ranking them with the surrogate reward. This parameter should be 1 for NAC coloring
  # counting, because there only the main reward is computed.
  main_reward_compute_ratio: ${eval:${training.train_best} * 4}
  # main_reward_compute_ratio: 1

model:
  # type: MLP
  # nn_size: [128, 128, 128, 128]

  type: GIN
  # number of GIN graph encoder layers
  n_GIN_layers: 3

  # size of the hidden layers of the GIN encoder, its output layer and hidden layers of extension scoring MLP head.
  # Exactly 3 values should be given.
  nn_size: [128, 32, 128]

  n_epochs: 4

  # Path to a pretrained model's weights.
  # Set to Null to train from scratch.
  load_weights_from: Null
  # load_weights_from: "mlruns/979522387992820666/8452530bdbcc4c97b4bee336056e499b/artifacts/model_weights.pth"

# coefficients of entropy coef decrease in formula:
# entropy_coef = coef_init / (1 + alpha * ln(1 + gen * e**(-beta)))
entropy:
  # Empirically derived coef_init values for n_vertices=3-23 to ensure that less than half of 
  # generated graphs are non-isomorphic at generation 200 (with gen_size=1000). Standard
  # multiplier is 2.0, use 3.0 for NAC colorings.
  coef_init: ${eval:"([0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 
                       0.5, 0.5, 0.5, 0.5, 0.372, 0.266, 0.213, 0.183, 0.163,
                       0.149, 0.138, 0.129, 0.123, 0.117][${problem.n_vertices} - 3]) * 2.0"}
  alpha: 6
  beta: 7

optimizer:
  # learning rate of the optimizer
  lr: 0.0005

# set Hydra save directories
hydra:
  run:
    dir: .hydra
  sweep:
    dir: .hydra
